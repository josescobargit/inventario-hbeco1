services:
  - type: web
    name: inventario-operativo-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: API_PREFIX
        value: /api/v1
      - key: DOCUMENT_OCR_CONCURRENCY
        value: "1"
      - key: DOCUMENT_DIGITAL_CONCURRENCY
        value: "2"
      - key: DOCUMENT_OCR_TIMEOUT_SECONDS
        value: "120"
      - key: DOCUMENT_MAX_PAGES
        value: "50"
      - key: DOCUMENT_MAX_IMAGE_PIXELS
        value: "30000000"
      - key: DOCUMENT_MEMORY_TRACING
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: SESSION_COOKIE_NAME
        value: inventario_session
      - key: SESSION_TTL_HOURS
        value: "12"
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ORIGIN_REGEX
        sync: false
